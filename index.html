<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slinky Master</title>
<style>
  html,body{margin:0;height:100%;background:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;touch-action:none;user-select:none}
  canvas{display:block;cursor:grab}
  #top{position:fixed;top:0;left:0;right:0;display:grid;grid-template-columns:1fr 1fr;align-items:center;padding:10px 24px;pointer-events:none;z-index:2}
  #top > *{pointer-events:auto}
  #info{display:flex;align-items:center;gap:22px}
  #info img{height:72px;display:block}
  #lvl{font:600 20px system-ui,sans-serif;color:#111;display:flex;align-items:center;gap:12px}
  #lvlStars{display:flex;gap:2px}
  #moves{font:16px system-ui,sans-serif;color:#666}
  #ui{display:flex;gap:8px;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
  #brandWrap{justify-self:end}
  #brand{display:inline-block;font:700 14px system-ui,sans-serif;padding:8px 14px;border:2px solid #111;border-radius:999px;color:#111;text-decoration:none;background:#fff}
  #brand:hover{background:#111;color:#fff}
  button{font:600 14px system-ui,sans-serif;padding:8px 14px;border:2px solid #111;background:#fff;color:#111;border-radius:999px;cursor:pointer}
  button:hover{background:#111;color:#fff}
  #menu{position:fixed;inset:0;background:rgba(255,255,255,.86);display:flex;align-items:center;justify-content:center;z-index:5}
  #menu[hidden],#intro[hidden]{display:none}
  #intro{position:fixed;inset:0;background:rgba(255,255,255,.86);display:flex;align-items:center;justify-content:center;z-index:6}
  #intro .box{background:#fff;border:2px solid #111;border-radius:22px;width:min(560px,92vw);box-sizing:border-box;text-align:center;padding:30px 40px 34px}
  #intro img{width:min(420px,70vw);display:block;margin:0 auto 22px}
  #intro ol{text-align:left;margin:0 auto 18px;padding-left:22px;max-width:440px;font:17px/1.55 system-ui,sans-serif;color:#222}
  #intro ol li{margin-bottom:6px}
  #intro p{margin:0 auto 24px;max-width:440px;font:15px/1.5 system-ui,sans-serif;color:#666}
  #intro .play{font:700 18px system-ui,sans-serif;padding:12px 44px;border:2px solid #111;border-radius:999px;background:#111;color:#fff;cursor:pointer}
  #intro .play:hover{background:#fff;color:#111}
  #menu .box{background:#fff;border:2px solid #111;border-radius:22px;padding:22px 26px 26px;width:min(620px,92vw)}
  #menu .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  #menu .head b{font-size:22px}
  #grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  .tile{aspect-ratio:1;border:2px solid #111;border-radius:16px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:700 24px system-ui;color:#111;cursor:pointer;padding:0}
  .tile:hover{background:#111;color:#fff}
  .tile.current{box-shadow:0 0 0 3px #ffc61a}
  .tile .st{font-size:15px;display:flex;gap:2px}
  .tile .st i{font-style:normal;color:#ddd}
  .tile .st i.on{color:#ffc61a}
  .tile:disabled{opacity:.3;cursor:default;background:#fff;color:#111}
  .tile:disabled .st{font-size:16px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top">
  <div id="info">
    <img id="logo" alt="Slinky Master">
    <div id="lvl"><span id="lvlName">Nivel 1</span><span id="lvlStars"></span></div>
    <div id="moves">Movimientos: 0</div>
  </div>
  <div id="ui">
    <button id="btnLevels">Niveles</button>
    <button id="btnColor">Arcoíris</button>
    <button id="btnReset">Reintentar (R)</button>
  </div>
  <div id="brandWrap"><a id="brand" href="#" target="_blank" rel="noopener">ProhibidoNoJugar</a></div>
</div>
<div id="intro">
  <div class="box">
    <img id="introLogo" alt="Slinky Master">
    <ol>
      <li>Arrastrá la base del resorte por la plataforma.</li>
      <li>Agarrá la parte de arriba y estirala hasta donde quieras.</li>
      <li>Soltá: la inercia hace el resto.</li>
    </ol>
    <p>Llevá el resorte hasta abajo o hasta la bandera.<br>Cuantos menos movimientos, más estrellas.</p>
    <button class="play" id="btnPlay">Jugar</button>
  </div>
</div>
<div id="menu" hidden>
  <div class="box">
    <div class="head"><b>Niveles</b><button id="menuClose">✕</button></div>
    <div id="grid"></div>
  </div>
</div>
<script>
// ======================================================
//  SLINKY — Nivel 1: bajar 10 escalones
// ======================================================
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

let scale = 1, offX = 0, offY = 0;

// ===== <physics> =====
// Todo lo que decide adónde va el resorte. No dibuja nada.
const VW = 1280, VH = 720;
const RR = 13;            // medio ancho del resorte
const K = Math.SQRT1_2;   // "inercia": cada vuelta llega a K * (separación entre los extremos)
const DMIN = 24;          // si la vuelta alcanzaría menos que esto, el resorte se queda quieto
const ARC_CLEAR = 60;     // altura que necesita el arco: algo más alto en el camino lo frena

// ---- Niveles ----
// Escaleras simples: cols = escalones de cada columna, separadas por huecos de "gap" escalones.
// Niveles especiales: build(api) arma el terreno con bloques, la salida y la meta.
const PARS = [1, 4, 1, 1, 2, 3, 2, 1, 1, 3, 2, 1, 2, 3, 1, 3, 2, 1, 3, 3];   // menor cantidad de movimientos (calculado con el simulador)
const LEVELS = [
  { cols: [9], size: 52.5 },
  { cols: [1, 2, 2, 2, 2], size: 52.5, gap: 1, plat: 386, mirror: true },
  { size: 52.5, build: ({ start, stairs, block, goal, wall }) => {        // mini golf: frená en la bandera
      start(0, 300, 260);
      const e = stairs(300, 260, 3);
      block(e.x, 1240, e.y, VH + 400);
      wall(1240, 1280, 120);
      goal(950, 1050, e.y, true);
  } },
  { cols: [10], size: 48, mirror: true },
  { size: 45, build: ({ start, stairs, block, goal, wall }) => {         // pared: volver para atrás
      start(0, 260, 150, 22);
      const e = stairs(260, 150, 5, 22);                                   // escalera flotante
      block(e.x, e.x + 110, e.y, e.y + 22);
      block(0, 1180, 650, VH + 400);                                       // piso de abajo
      wall(1180, 1280, 120);
      goal(120, 230, 650, true);
  } },
  { cols: [5, 2, 2], size: 52.5, gap: 1, mirror: true },
  { size: 45, build: ({ start, stairs, block, goal, wall }) => {         // obstáculo en la escalera
      start(0, 240, 160);
      let e = stairs(240, 160, 5);
      block(e.x, e.x + 90, e.y, VH + 400);
      wall(e.x + 50, e.x + 68, e.y - 70);
      e = stairs(e.x + 90, e.y, 6);
      block(e.x, VW + 400, e.y, VH + 400);

  } },
  { cols: [11], size: 45 },
  { size: 45, build: ({ start, stairs, block, goal, wall }) => {         // mini golf con pozos
      start(0, 250, 300);
      const e = stairs(250, 300, 2);
      block(e.x, 640, e.y, VH + 400);
      block(730, 900, e.y, VH + 400);
      block(990, 1240, e.y, VH + 400);
      wall(1240, 1280, 160);
      goal(1080, 1160, e.y, true);
  }, mirror: true },
  { cols: [1, 2, 2, 2, 2], size: 48, gap: 1 },
  { size: 42, build: ({ start, stairs, block, goal, wall }) => {         // pared + escalera flotante, más chica
      start(0, 230, 140, 20);
      const e = stairs(230, 140, 6, 20);
      block(e.x, e.x + 120, e.y, e.y + 20);
      block(0, 1150, 660, VH + 400);
      wall(1150, 1280, 100);
      goal(60, 150, 660, true);
  }, mirror: true },
  { cols: [12], size: 42 },
  { size: 45, build: ({ start, stairs, block, goal, wall }) => {         // dos obstáculos
      start(0, 230, 150);
      let e = stairs(230, 150, 3);
      block(e.x, e.x + 90, e.y, VH + 400); wall(e.x + 48, e.x + 64, e.y - 70);
      e = stairs(e.x + 90, e.y, 3);
      block(e.x, e.x + 90, e.y, VH + 400); wall(e.x + 48, e.x + 64, e.y - 70);
      e = stairs(e.x + 90, e.y, 4);
      block(e.x, VW + 400, e.y, VH + 400);
      goal(e.x, VW, e.y);
  }, mirror: true },
  { cols: [3, 2, 2, 2], size: 48, gap: 1 },
  { size: 45, build: ({ start, stairs, block, goal, wall }) => {         // mini golf: bandera chica entre pozos
      start(0, 230, 330);
      const e = stairs(230, 330, 2);
      block(e.x, 560, e.y, VH + 400);
      block(650, 760, e.y, VH + 400);
      block(850, 940, e.y, VH + 400);
      block(1030, 1240, e.y, VH + 400);
      wall(1240, 1280, 200);
      goal(870, 925, e.y, true);
  } },
  { cols: [2, 2, 2, 2, 2], size: 45, gap: 1, mirror: true },
  { size: 42, build: ({ start, stairs, block, goal, wall }) => {         // pared, columnas y vuelta atrás
      start(0, 220, 130, 20);
      let e = stairs(220, 130, 2, 20);
      for (let k = 0; k < 3; k++) { e = stairs(e.x + 42, e.y, 2, 20); }
      block(e.x, e.x + 100, e.y, e.y + 20);
      block(0, 1160, 665, VH + 400);
      wall(1160, 1280, 100);
      goal(70, 160, 665, true);
  } },
  { cols: [13], size: 39, mirror: true },
  { cols: [1, 2, 2, 2, 2, 2], size: 45, gap: 1 },
  { cols: [2, 2, 2, 2, 2, 2], size: 42, gap: 1, mirror: true },
];

// ---- Terreno del nivel actual ----
let RECTS = [], GOAL = null, START = null, W = 52.5, H = 52.5, MIRROR = false;
function buildLevel(spec) {
  W = H = spec.size; MIRROR = !!spec.mirror;
  RECTS = []; GOAL = null;
  const api = {
    block: (x0, x1, y0, y1) => RECTS.push({ x0, x1, y0, y1 }),
    wall: (x0, x1, y0) => RECTS.push({ x0, x1, y0, y1: VH + 400, wall: true }),
    start: (x0, x1, y, thick) => { START = { x0: Math.max(x0, 0), x1, y }; RECTS.push({ x0: x0 - 400, x1, y0: y, y1: thick ? y + thick : VH + 400 }); },
    // escalera que baja hacia la derecha; thick = grosor si es flotante
    stairs: (x, y, n, thick) => {
      for (let k = 0; k < n; k++) { y += H; RECTS.push({ x0: x, x1: x + W, y0: y, y1: thick ? y + thick : VH + 400 }); x += W; }
      return { x, y };
    },
    goal: (x0, x1, y, flag) => { GOAL = { x0, x1, y, flag: !!flag }; },
  };
  if (spec.build) { spec.build(api); return; }
  // escalera / columnas con huecos
  const plat = spec.plat || 231, drops = spec.cols.reduce((a, b) => a + b, 0) + 1;
  const top = Math.max(127, 673.5 - drops * H), gapW = (spec.gap || 0) * W;
  api.start(0, plat, top);
  let e = { x: plat, y: top };
  spec.cols.forEach((c, ci) => { if (ci > 0) e.x += gapW; e = api.stairs(e.x, e.y, c); });
  if (spec.cols.length > 1) e.x += gapW;
  e.y += H;
  api.block(e.x, VW + 400, e.y, VH + 400);
  api.goal(e.x, VW, e.y);
}

function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
// Bloque que contiene el punto
function rectAt(x, y) { return RECTS.find(r => x >= r.x0 && x < r.x1 && y > r.y0 + 0.01 && y < r.y1); }
// Primera superficie en x, a la altura y o más abajo
function support(x, y) {
  let best = null;
  for (const r of RECTS) if (x >= r.x0 && x < r.x1 && r.y0 >= y - 0.5 && (!best || r.y0 < best.y0)) best = r;
  return best;
}
function outOfBounds(x) { return x < RR * 0.5 || x > VW - RR * 0.5; }
function onGoal(p) { return GOAL && Math.abs(p.y - GOAL.y) < 1 && p.x >= GOAL.x0 && p.x <= GOAL.x1; }

// ¿Apoya bien un extremo que llega en dirección dir sobre el bloque r?
function footing(r, x, dir) {
  const behind = dir > 0 ? x - r.x0 : r.x1 - x, ahead = dir > 0 ? r.x1 - x : x - r.x0;
  if (behind < RR + 1) return 'bump';      // pegó contra el borde de atrás y rebotó
  if (ahead < RR * 0.3) return 'slip';     // quedó en el borde y resbaló
  return null;
}

// Una vuelta desde el pivote P (con la otra punta en Q), en dirección dir
//   stop: se queda quieto en P · land: aterriza en {x1, L} · fall: se cae (why)
function step(P, Q, dir) {
  const D = K * dist(P, Q);
  if (D < DMIN) return { type: 'stop' };
  const x1 = P.x + dir * D, lo = Math.min(P.x, x1), hi = Math.max(P.x, x1);
  for (const r of RECTS)                                   // pared u obstáculo en el camino
    if (r.x1 > lo + 1 && r.x0 < hi - 1 && r.y0 < P.y - 1 && r.y1 > P.y - ARC_CLEAR) return { type: 'stop', wall: true };
  if (outOfBounds(x1)) return { type: 'fall', x1, y1: P.y + 40, why: 'out' };
  const L = support(x1, P.y);
  for (let x = lo + 2; x < hi - 1; x += 3) {             // ¿se salteó un escalón?
    const r = support(x, P.y);
    if (r && L && r.y0 > P.y + 1 && r.y0 < L.y0 - 1) return { type: 'fall', x1, y1: L.y0, why: 'skip' };
  }
  if (!L || L.y0 > P.y + 1.6 * H) return { type: 'stop' }; // adelante hay un vacío: se frena en el borde
  const f = footing(L, x1, dir);
  if (f) return { type: 'fall', x1, y1: L.y0, why: f };
  return { type: 'land', x1, y1: L.y0 };
}

// Dónde queda la punta si la soltás con el puntero en (x, y)
function tipSurface(x, y) {
  if (outOfBounds(x)) return null;
  const inside = rectAt(x, y);
  return inside || support(x, y);
}
// Revisa la punta recién apoyada
function placeTip(base, tip) {
  const dir = Math.sign(tip.x - base.x) || 1;
  const r = tipSurface(tip.x, tip.y - 0.5);
  if (!r || Math.abs(r.y0 - tip.y) > 0.5) return { fall: true, why: 'air', dir };
  const f = footing(r, tip.x, dir);
  if (f) return { fall: true, why: f, dir };
  return { fall: false, dir };
}

// Simula un tiro completo (para calcular el par de cada nivel)
function simulate(base, tip) {
  const pl = placeTip(base, tip);
  if (pl.fall) return { type: 'fall' };
  let Q = base, P = tip;
  for (let n = 0; n < 80; n++) {
    const st = step(P, Q, pl.dir);
    if (st.type === 'stop') return onGoal(P) ? { type: 'win' } : { type: 'stop', at: P };
    if (st.type === 'fall') return { type: 'fall' };
    Q = P; P = { x: st.x1, y: st.y1 };
  }
  return { type: 'stop', at: P };
}
// ===== </physics> =====

// ---- Resorte ----
const N = 44;             // espiras
const GAP = 0.85;         // separación entre espiras apiladas
const NA = 18;            // espiras que forman el arco entre las dos pilas
const LIFT = 1;
const FLOW_TIME = 0.32;   // segundos que tardan las espiras en pasar de una pila a la otra
const SWING_TIME = 0.22;  // segundos que tarda el extremo en dar la vuelta
const F_END = N - 1 - NA;

// Si un punto quedó "adentro" de un bloque, lo saca por el lado más cercano
// Los bloques pegados se tratan como una sola masa: nunca se saca un punto de un bloque
// para meterlo en el de al lado. prev (opcional) = de dónde venía, para salir por donde entró.
function pushOut(x, y, prev) {
  const r = rectAt(x, y);
  if (!r) return null;
  const free = o => !rectAt(x + o.dx, y + o.dy);
  const top = { dx: 0, dy: r.y0 - y - 0.3 }, bottom = { dx: 0, dy: r.y1 - y + 0.3 },
        left = { dx: r.x0 - x - 0.3, dy: 0 }, right = { dx: r.x1 - x + 0.3, dy: 0 };
  const cand = [];
  if (prev) {                                          // por dónde entró
    if (prev.y <= r.y0 + 0.5) cand.push(top);
    else if (prev.y >= r.y1 - 0.5) cand.push(bottom);
    if (prev.x <= r.x0 + 0.5) cand.push(left);
    else if (prev.x >= r.x1 - 0.5) cand.push(right);
  }
  cand.push(...[top, bottom, left, right].sort((a, b) => Math.abs(a.dx) + Math.abs(a.dy) - Math.abs(b.dx) - Math.abs(b.dy)));
  for (const o of cand) if (free(o)) return o;
  // todo bloqueado: subir hasta encontrar aire
  let yy = y, guard = 0, q;
  while ((q = rectAt(x, yy)) && guard++ < 50) yy = q.y0 - 0.3;
  return { dx: 0, dy: yy - y };
}

// ======================================================
//  Sonido: golpes reales de un slinky metálico bajando
//  (recortados de la grabación de referencia, embebidos en mp3)

let actx = null, master = null, stepBufs = [];
function initAudio() {
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = 1.4; master.connect(actx.destination);
    STEP_SOUNDS.forEach((url, i) => {
      const bin = atob(url.split(',')[1]), arr = new Uint8Array(bin.length);
      for (let k = 0; k < bin.length; k++) arr[k] = bin.charCodeAt(k);
      actx.decodeAudioData(arr.buffer, buf => { stepBufs[i] = buf; });
    });
  }
  if (actx.state === 'suspended') actx.resume();
}
let lastClip = -1;
function stepSound(vol = 1) {
  if (!actx) return;
  const ready = stepBufs.filter(Boolean); if (!ready.length) return;
  let k; do { k = Math.floor(Math.random() * ready.length); } while (ready.length > 1 && k === lastClip);
  lastClip = k;
  const src = actx.createBufferSource(); src.buffer = ready[k];
  src.playbackRate.value = 0.94 + Math.random() * 0.12;
  const g = actx.createGain(); g.gain.value = vol;
  src.connect(g).connect(master); src.start();
}

let S, ghosts = {}, rainbow = false, level = 0, wonStars = 0;
// Mini golf: 3 estrellas si lo hacés en el par, 2 si te pasás por 1 o 2, si no 1
function starsFor(moves, par) { return moves <= par ? 3 : moves <= par + 2 ? 2 : 1; }

// Progreso: mejores estrellas de cada nivel (se guarda en el navegador)
const SAVE_KEY = 'slinkyMaster.v2';

function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify({ best })); } catch (e) {} }
function unlocked(i) { return i === 0 || best[i - 1] > 0; }

  level = i;

}

    back: { ...home }, front: { ...home }, home,
    m: true, f: 0, t: 0, dir: 1,
    swing: null, next: null, stopAfter: false,
    moves: 0, drag: null, timer: 0,

  };

{ let first = 0; while (first < LEVELS.length - 1 && best[first] > 0) first++; loadLevel(first); }

// Prepara el giro del extremo libre (S.back) por encima de la pila de adelante (S.front)
function startSwing(settle) {
  const Pg = S.front, dir = S.dir;
  const Ptop = { x: Pg.x, y: Pg.y - LIFT - F_END * GAP };
  const F0 = { x: S.back.x, y: S.back.y - LIFT };
  const F1 = settle ? { x: Ptop.x, y: Ptop.y - NA * GAP } : { x: S.next.x1, y: S.next.y1 - LIFT };
  const lx = p => dir * (p.x - Ptop.x);
  let a0 = Math.atan2(F0.y - Ptop.y, lx(F0)); if (a0 < 0) a0 += Math.PI * 2;
  let a1 = Math.atan2(F1.y - Ptop.y, lx(F1));

  S.swing = { Ptop, a0, a1, R0: dist(Ptop, F0), R1: dist(Ptop, F1), settle };

function afterLanding() {
  S.next = step(S.front, S.back, S.dir);

function ragStep() {
  const P = S.rag.p;
  let maxV = 0;
  for (const q of P) {
    let vx = (q.x - q.px) * 0.996, vy = (q.y - q.py) * 0.996 + G;
    const v = Math.hypot(vx, vy); if (v > 7) { vx *= 7 / v; vy *= 7 / v; }   // sin atravesar paredes
    q.ox = q.x; q.oy = q.y;
    q.px = q.x; q.py = q.y; q.x += vx; q.y += vy;
  }
  for (let it = 0; it < 10; it++) {
    for (let i = 0; i < P.length - 1; i++) {
      const a = P[i], b = P[i + 1], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.001;
      const tgt = d > SMAX ? SMAX : d < GAP ? GAP : d;
      if (tgt !== d) { const k = (d - tgt) / d / 2; a.x += dx * k; a.y += dy * k; b.x -= dx * k; b.y -= dy * k; }
    }
    for (let i = 0; i < P.length - 2; i++) {          // un poco de rigidez
      const a = P[i], b = P[i + 2], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.001;
      if (d < 1.8 * GAP) { const k = (d - 1.8 * GAP) / d / 2; a.x += dx * k; a.y += dy * k; b.x -= dx * k; b.y -= dy * k; }
    }
    for (const q of P) {
      const o = pushOut(q.x, q.y, { x: q.ox, y: q.oy });
      if (!o) continue;
      q.x += o.dx; q.y += o.dy;
      if (o.dy < 0) { q.py = q.y; q.px = q.x - (q.x - q.px) * 0.5; }   // apoyada: rozamiento
    }

  for (const q of P) {
    for (let k = 0; k < 4; k++) { const o = pushOut(q.x, q.y, { x: q.ox, y: q.oy }); if (!o) break; q.x += o.dx; q.y += o.dy; }

}
function updateFall(dt) {
  const R = S.rag; R.t += dt; R.acc += dt;
  while (R.acc > 1 / 60) {
    R.acc -= 1 / 60;
    const v = ragStep();
    R.still = v < 0.08 ? R.still + 1 : 0;
  }
  const P = R.p;
  const gone = P.every(q => q.y > VH + 30 || q.x < -30 || q.x > VW + 30);
  if (!(gone || R.still > 15 || R.t > 4)) return;
  // ¿dónde quedó?
  const cx = P.reduce((a, q) => a + q.x, 0) / P.length, minY = Math.min(...P.map(q => q.y));
  const r = !gone && !outOfBounds(cx) ? support(cx, minY - 1) : null;
  if (!r || r.y0 > VH || r.x1 - r.x0 < 2 * RR + 2) return startGather(S.home, true);   // se perdió: vuelve
  const x = Math.max(r.x0 + RR + 1, Math.min(r.x1 - RR * 0.3, cx));
  startGather({ x, y: r.y0 }, false);

// Junta las espiras en una pila en "to"
function startGather(to, lost) {
  S.gather = { t: 0, to, lost, from: S.rag.p.map(q => ({ x: q.x, y: q.y, abs: q.abs })) };
  S.rag = null; S.phase = 'gather';
}
function stackHeightOf(abs) { const j = S.m ? N - 1 - abs : abs; return N - 1 - j; }
function finishStop(at) {
  S.back = { ...at }; S.front = { ...at }; S.home = { ...at };
  if (onGoal(at)) {
    S.phase = 'win'; wonStars = starsFor(S.moves, PARS[level]);
    best[level] = Math.max(best[level], wonStars); save();
  } else S.phase = 'place';
}

function update(dt) {
  if (S.phase === 'wait') {
    S.timer -= dt;
    if (S.timer <= 0) { S.phase = 'flow'; S.t = 0; S.f = 0; }
  } else if (S.phase === 'flow') {
    S.t += dt / FLOW_TIME;
    const e = Math.min(1, S.t);
    S.f = F_END * Math.pow(e, 1.5);          // se acelera, como con la gravedad
    if (S.t >= 1) { S.f = F_END; startSwing(S.stopAfter); }
  } else if (S.phase === 'swing') {
    S.t += dt / SWING_TIME;
    if (S.t >= 1) {
      stepSound(S.swing.settle ? 0.6 : 1);
      S.m = !S.m;
      if (S.swing.settle) { finishStop(S.front); return; }
      const nx = S.next;
      S.back = S.front; S.front = { x: nx.x1, y: nx.y1 };
      if (nx.type === 'fall') { S.f = 0; S.phase = 'falling-start'; S.why = nx.why; return; }
      afterLanding();
    }
  } else if (S.phase === 'falling-start') {
    startFall(S.why);                        // en el cuadro anterior ya se dibujó la posición de aterrizaje
  } else if (S.phase === 'fall') {
    updateFall(dt);
  } else if (S.phase === 'gather') {
    const g = S.gather; g.t += dt / (g.lost ? 0.45 : 0.3);
    if (g.t >= 1) { if (!g.lost) stepSound(0.5); finishStop(g.to); }
  }
}

// ======================================================
//  Dibujo
// ======================================================
function bez(p0, p1, p2, p3, t) {
  const u = 1 - t;
  return {
    x: u*u*u*p0.x + 3*u*u*t*p1.x + 3*u*t*t*p2.x + t*t*t*p3.x,
    y: u*u*u*p0.y + 3*u*u*t*p1.y + 3*u*t*t*p2.y + t*t*t*p3.y
  };
}
// Arco entre dos puntos, recorrido a velocidad constante (para que las espiras se repartan parejo)
function arcBase(A, B) { return Math.max(13, Math.min(44, 0.5 * dist(A, B))); }
const ARC_M = 64;
// Convierte una lista de puntos en un camino recorrido a velocidad constante
function arcFromPts(pts) {
  const M = pts.length - 1, len = [0];
  for (let k = 1; k <= M; k++) len.push(len[k - 1] + dist(pts[k], pts[k - 1]));
  const total = len[M];
  return s => {
    const L = s * total;
    let k = 0; while (k < M - 1 && len[k + 1] < L) k++;
    const seg = len[k + 1] - len[k];
    const u = seg > 1e-6 ? (L - len[k]) / seg : 0;
    let ang = -Math.PI / 2;
    for (let q = k; q < M && q >= 0; q++) {          // dirección del tramo (salteando tramos nulos)
      const dx = pts[q + 1].x - pts[q].x, dy = pts[q + 1].y - pts[q].y;
      if (Math.hypot(dx, dy) > 1e-6) { ang = Math.atan2(dy, dx); break; }
    }
    return { x: pts[k].x + (pts[k + 1].x - pts[k].x) * u, y: pts[k].y + (pts[k + 1].y - pts[k].y) * u, ang };
  };
}
function resample(fn) { const out = []; for (let i = 0; i <= ARC_M; i++) out.push(fn(i / ARC_M)); return out; }

function bezPts(A, angA, hA, B, angB, hB) {
  const c1 = { x: A.x + Math.cos(angA) * hA, y: A.y + Math.sin(angA) * hA };
  const c2 = { x: B.x + Math.cos(angB) * hB, y: B.y + Math.sin(angB) * hB };
  const pts = []; for (let k = 0; k <= ARC_M; k++) pts.push(bez(A, c1, c2, B, k / ARC_M));
  return resample(arcFromPts(pts));
}
// Forma real del resorte entre dos pilas: medio círculo sobre la pila más alta
// (radio nunca menor que el del resorte, así las espiras no se cruzan)
// y después la parte que cuelga hasta la pila más baja.
function uPts(A, B) {
  const hiIsA = A.y <= B.y, hi = hiIsA ? A : B, lo = hiIsA ? B : A;
  const dir = Math.sign(lo.x - hi.x) || 1, dx = Math.abs(lo.x - hi.x);
  const r = Math.max(RR * 1.2, Math.min(34, dx / 2));
  const pts = [];
  for (let k = 0; k <= 24; k++) {
    const th = Math.PI * k / 24;
    pts.push({ x: hi.x + dir * (r - r * Math.cos(th)), y: hi.y - r * Math.sin(th) });
  }
  const E = pts[pts.length - 1], drop = Math.max(0, lo.y - E.y);
  const kk = Math.max(6, drop * 0.45);
  const c1 = { x: E.x, y: E.y + kk }, c2 = { x: lo.x, y: lo.y - kk };
  for (let k = 1; k <= 24; k++) pts.push(bez(E, c1, c2, lo, k / 24));
  if (!hiIsA) pts.reverse();
  return resample(arcFromPts(pts));
}
function blendArc(P1, P2, w) {
  const pts = P1.map((p, i) => ({ x: p.x + (P2[i].x - p.x) * w, y: p.y + (P2[i].y - p.y) * w }));
  return arcFromPts(pts);
}

// Cada espira, vista de costado, es una línea recta. Primero se calculan todas,
// después se corrigen las que atravesarían un escalón y al final se dibujan
// unidas por el alambre (la parte de atrás de cada vuelta del espiral).
let coils = [];
function addCoil(x, y, ang, abs) { coils.push({ x, y, ang, abs }); }

function resolveCoil(c) {
  for (let it = 0; it < 4; it++) {
    const nx = -Math.sin(c.ang), ny = Math.cos(c.ang);
    let best = null;
    for (const sgn of [1, -1]) {
      const p = pushOut(c.x + nx * RR * sgn, c.y + ny * RR * sgn);
      if (p && (!best || Math.abs(p.dx) + Math.abs(p.dy) > Math.abs(best.dx) + Math.abs(best.dy))) best = p;
    }
    const pc = pushOut(c.x, c.y);
    if (pc && (!best || Math.abs(pc.dx) + Math.abs(pc.dy) > Math.abs(best.dx) + Math.abs(best.dy))) best = pc;
    if (!best) return;
    c.x += best.dx; c.y += best.dy;
  }
}

function colors(abs) {
  const t = abs / (N - 1);
  if (rainbow) return [`hsl(${330 - t * 300},75%,26%)`, `hsl(${330 - t * 300},95%,60%)`, `hsl(${330 - t * 300},70%,40%)`];
  return ['#4f555c', abs % 2 ? '#eef1f4' : '#c3c9cf', '#7d848c'];
}

let lastSnap = null, prevSnap = null;
function flushCoils() {
  for (const c of coils) resolveCoil(c);
  prevSnap = lastSnap; lastSnap = coils.map(c => ({ x: c.x, y: c.y, abs: c.abs }));
  const ends = coils.map(c => {
    const nx = -Math.sin(c.ang), ny = Math.cos(c.ang);
    return { ax: c.x + nx * RR, ay: c.y + ny * RR, bx: c.x - nx * RR, by: c.y - ny * RR, nx, ny };
  });
  // alambre de atrás: del extremo B de una espira al extremo A de la siguiente
  ctx.lineWidth = 1;
  for (let i = 0; i < coils.length - 1; i++) {
    ctx.strokeStyle = colors(coils[i].abs)[2];
    ctx.beginPath(); ctx.moveTo(ends[i].bx, ends[i].by); ctx.lineTo(ends[i + 1].ax, ends[i + 1].ay); ctx.stroke();
  }
  // parte de adelante de cada vuelta
  for (let i = 0; i < coils.length; i++) {
    const c = coils[i], e = ends[i], [dark, light] = colors(c.abs);
    ctx.beginPath(); ctx.moveTo(e.ax, e.ay); ctx.lineTo(e.bx, e.by);
    ctx.lineWidth = 1.7; ctx.strokeStyle = dark; ctx.stroke();
    const ins = 1.6;
    ctx.beginPath(); ctx.moveTo(e.ax - e.nx * ins, e.ay - e.ny * ins); ctx.lineTo(e.bx + e.nx * ins, e.by + e.ny * ins);
    ctx.lineWidth = 0.8; ctx.strokeStyle = light; ctx.stroke();
  }
  coils = [];
}

const UP = -Math.PI / 2, DOWN = Math.PI / 2;

// Dos pilas y el arco que las une. f = cuántas espiras ya pasaron a la pila de adelante.
function drawFlow(Sg, Tg, f) {
  const Ttop = { x: Tg.x, y: Tg.y - LIFT - f * GAP };
  const Stop = { x: Sg.x, y: Sg.y - LIFT - (N - 1 - (f + NA)) * GAP };
  const arc = arcFromPts(uPts(Ttop, Stop));
  for (let j = 0; j < N; j++) {
    if (j <= f) addCoil(Tg.x, Tg.y - LIFT - j * GAP, UP, absIdx(j));
    else if (j >= f + NA) addCoil(Sg.x, Sg.y - LIFT - (N - 1 - j) * GAP, DOWN, absIdx(j));
    else { const p = arc((j - f) / NA); addCoil(p.x, p.y, p.ang, absIdx(j)); }
  }
  flushCoils();
}

// El extremo libre gira por encima de la pila de adelante
function drawSwing() {
  const sw = S.swing, Pg = S.front;
  const e = 0.5 - 0.5 * Math.cos(Math.PI * Math.min(1, S.t));
  const a = sw.a0 + (sw.a1 - sw.a0) * e;
  const R = sw.R0 + (sw.R1 - sw.R0) * e + (sw.settle ? 6 : 20) * Math.sin(Math.PI * e);
  const F = { x: sw.Ptop.x + S.dir * Math.cos(a) * R, y: sw.Ptop.y + Math.sin(a) * R };
  const loc = UP + (sw.settle ? Math.PI : Math.PI * 2) * e;
  const angF = S.dir > 0 ? loc : Math.PI - loc;      // hacia la izquierda, el giro se espeja
  const b = arcBase(sw.Ptop, F), up = Math.max(0, -Math.sin(angF));
  const bz = bezPts(sw.Ptop, UP, b + Math.max(0, sw.Ptop.y - F.y) * up,

  // al principio y al final del giro los dos extremos miran hacia arriba: ahí se usa la forma real
  const w = sw.settle ? 0 : Math.pow(up, 3);
  const arc = w > 0.001 ? blendArc(bz, uPts(sw.Ptop, F), w) : arcFromPts(bz);
  for (let j = 0; j < N; j++) {
    if (j <= F_END) addCoil(Pg.x, Pg.y - LIFT - j * GAP, UP, absIdx(j));
    else { const p = arc((j - F_END) / NA); addCoil(p.x, p.y, p.ang, absIdx(j)); }
  }
  flushCoils();
}

function drawStack(g, fromBottomAbs) {
  for (let j = 0; j < N; j++) addCoil(g.x, g.y - LIFT - j * GAP, UP, fromBottomAbs(j));
  flushCoils();
}

function drawChain(pts) {
  for (let i = 0; i < pts.length; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    addCoil(pts[i].x, pts[i].y, Math.atan2(b.y - a.y, b.x - a.x) || UP, pts[i].abs);
  }
  flushCoils();
}
function drawSlinky() {
  if (S.phase === 'swing') return drawSwing();
  if (S.phase === 'fall') return drawChain(S.rag.p);
  if (S.phase === 'gather') {
    const g = S.gather, e = 1 - Math.pow(1 - Math.min(1, g.t), 3);
    return drawChain(g.from.map(q => {
      const tx = g.to.x, ty = g.to.y - LIFT - stackHeightOf(q.abs) * GAP;
      return { x: q.x + (tx - q.x) * e, y: q.y + (ty - q.y) * e, abs: q.abs };
    }));
  }
  if (dist(S.back, S.front) < 4) return drawStack(S.back, h => absIdx(N - 1 - h));
  drawFlow(S.back, S.front, S.f);

function drawStairs() {
  ctx.fillStyle = '#000';
  for (const r of RECTS) ctx.fillRect(r.x0, r.y0, r.x1 - r.x0 + 0.5, r.y1 - r.y0);
  if (GOAL && GOAL.flag) {                      // bandera de mini golf
    const cx = (GOAL.x0 + GOAL.x1) / 2;
    ctx.fillStyle = '#FFDD00'; ctx.fillRect(GOAL.x0, GOAL.y - 3, GOAL.x1 - GOAL.x0, 3);
    ctx.fillStyle = '#000'; ctx.fillRect(cx - 1, GOAL.y - 58, 2, 55);
    ctx.fillStyle = '#FFDD00';
    ctx.beginPath(); ctx.moveTo(cx + 1, GOAL.y - 58); ctx.lineTo(cx + 26, GOAL.y - 50); ctx.lineTo(cx + 1, GOAL.y - 42); ctx.closePath(); ctx.fill();
  }
}

function drawGhost() {
  const g = ghosts[ghostKey()];
  if (!g || S.phase !== 'place') return;
  ctx.fillStyle = 'rgba(235,60,60,0.9)';
  for (const q of g) {
    const r = support(q.x, q.y - 0.5); if (!r) continue;
    ctx.beginPath(); ctx.moveTo(q.x, r.y0 + 3); ctx.lineTo(q.x - 5, r.y0 + 11); ctx.lineTo(q.x + 5, r.y0 + 11); ctx.closePath(); ctx.fill();
  }
}

function wrap(text, maxW) {
  const words = text.split(' '), lines = []; let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  lines.push(cur); return lines;
}
function drawStar(cx, cy, r, on) {
  ctx.beginPath();
  for (let k = 0; k < 10; k++) {
    const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * 0.4 : r;
    ctx.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
  }
  ctx.closePath();
  ctx.fillStyle = on ? '#FFDD00' : '#DDDDDD'; ctx.fill();
}
// Cartel a la derecha, en la zona blanca
const PANEL_W = 440;
function panel(title, sub, stars) {
  const PANEL_X = MIRROR ? VW - 1010 : 1010;   // del lado blanco de la pantalla
  ctx.font = '600 21px system-ui';
  const lines = wrap(title, PANEL_W - 48);
  const h = 30 + lines.length * 28 + (stars ? 62 : 0) + (sub ? 30 : 0);
  const x = PANEL_X - PANEL_W / 2, y = 190;
  ctx.fillStyle = 'rgba(255,255,255,0.96)'; ctx.strokeStyle = '#111'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(x, y, PANEL_W, h, 16); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#111'; ctx.textAlign = 'center';
  let yy = y + 42;
  for (const l of lines) { ctx.fillText(l, PANEL_X, yy); yy += 28; }
  if (stars) { for (let k = 0; k < 3; k++) drawStar(PANEL_X + (k - 1) * 56, yy + 18, 22, k < stars); yy += 62; }
  if (sub) { ctx.font = '15px system-ui'; ctx.fillStyle = '#666'; ctx.fillText(sub, PANEL_X, yy + 4); }
}

const HINTS = {
  1: ['Antes de cada hueco el resorte se frena.', 'Lanzalo por encima hasta la columna siguiente.'],
  2: ['Mini golf: dejá el resorte quieto sobre la bandera.', 'Cuantos menos movimientos, más estrellas.'],
  4: ['Si choca contra una pared, se frena.', 'Ahí lo podés tirar para el otro lado.'],
};
let topKey = '';
function updateTopBar() {
  const k = level + '|' + best[level] + '|' + S.moves;
  if (k === topKey) return; topKey = k;
  document.getElementById('lvlName').textContent = `Nivel ${level + 1}`;
  document.getElementById('lvlStars').innerHTML = [0, 1, 2].map(q => starSVG(q < best[level], 20)).join('');
  document.getElementById('moves').textContent = `Movimientos: ${S.moves}`;
}
function drawHUD() {
  updateTopBar();
  const hint = HINTS[level];
  if (hint && S.phase === 'place' && S.moves < 2) {
    ctx.font = '15px system-ui'; ctx.fillStyle = '#666'; ctx.textAlign = 'center';
    hint.forEach((l, k) => ctx.fillText(l, MIRROR ? 560 : 820, 122 + k * 22));
  }
  if (S.phase === 'place' && S.drag === 'tip') {
    ctx.fillStyle = '#111'; ctx.textAlign = 'center'; ctx.font = '600 14px system-ui';
    const mx = (S.back.x + S.front.x) / 2;
    ctx.fillText(`abertura ${(dist(S.back, S.front) / 10).toFixed(1)} cm`, MIRROR ? VW - mx : mx, Math.max(20, Math.min(S.back.y, S.front.y) - 75));
  }
  if (S.phase === 'win') {
    const last = level === LEVELS.length - 1;
    if (last) {
      const tot = best.reduce((a, b) => a + b, 0);
      panel('¡Sos un Slinky Master!', `${tot} de ${LEVELS.length * 3} estrellas · Tocá para ver los niveles`, wonStars);
    } else {
      panel(`¡Nivel ${level + 1} superado!`, 'Tocá para pasar al siguiente nivel', wonStars);
    }
  }
}

function render() {
  const dpr = window.devicePixelRatio || 1;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * offX, dpr * offY);
  ctx.lineCap = 'butt';
  ctx.save();
  if (MIRROR) { ctx.translate(VW, 0); ctx.scale(-1, 1); }   // niveles que bajan hacia la izquierda
  drawStairs(); drawGhost(); drawSlinky();
  ctx.restore();
  drawHUD();
}

// ======================================================
//  Entrada (mouse y táctil)
// ======================================================
function toWorld(e) {
  const x = (e.clientX - offX) / scale, y = (e.clientY - offY) / scale;
  return { x: MIRROR ? VW - x : x, y };
}

cv.addEventListener('pointerdown', e => {
  initAudio();
  const p = toWorld(e);
  if (S.phase === 'win') { if (level === LEVELS.length - 1) openMenu(); else nextLevel(); return; }
  if (S.phase !== 'place') return;
  cv.setPointerCapture(e.pointerId);
  const stackH = N * GAP, b = S.back;
  const canMoveBase = S.moves === 0;               // la base solo se acomoda antes del primer tiro
  if (Math.abs(p.x - b.x) < RR + 14 && p.y > b.y - stackH - 35 && p.y < b.y + 15) {
    S.drag = (!canMoveBase || p.y < b.y - stackH * 0.45) ? 'tip' : 'base';
    cv.style.cursor = 'grabbing';
  }
});

cv.addEventListener('pointermove', e => {
  if (S.phase !== 'place' || !S.drag) return;
  const p = toWorld(e);
  if (S.drag === 'base') {
    const x = Math.max(START.x0 + RR + 10, Math.min(START.x1 - RR * 0.3, p.x));
    S.back = { x, y: START.y }; S.front = { ...S.back }; S.home = { ...S.back };
  } else {
    // se puede estirar hasta donde quieras: la punta se apoya en lo primero que haya debajo del puntero
    const x = Math.max(RR * 0.5, Math.min(VW - RR * 0.5, p.x));
    const r = tipSurface(x, p.y);
    S.front = r ? { x, y: r.y0 } : { x, y: Math.min(p.y, VH - 10) };
  }
});

cv.addEventListener('pointerup', () => {
  if (S.phase !== 'place' || !S.drag) return;
  const was = S.drag; S.drag = null; cv.style.cursor = 'grab';
  if (was !== 'tip') return;
  if (dist(S.back, S.front) < 2 * RR) { S.front = { ...S.back }; return; }   // casi no lo moviste
  S.moves++;
  ghosts[ghostKey()] = [{ x: S.back.x, y: S.back.y }, { x: S.front.x, y: S.front.y }];
  const pl = placeTip(S.back, S.front);
  S.dir = pl.dir;
  if (pl.fall) { S.phase = 'falling-start'; S.why = pl.why; return; }  // la punta quedó en el aire o mal apoyada
  stepSound(0.8);
  S.next = step(S.front, S.back, S.dir);
  S.stopAfter = S.next.type === 'stop';
  S.phase = 'wait'; S.timer = 0.2;
});

function nextLevel() { loadLevel(Math.min(level + 1, LEVELS.length - 1)); }
function starSVG(on, size = 18) {
  const pts = [];
  for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, r = k % 2 ? 4 : 10; pts.push((12 + Math.cos(a) * r).toFixed(1) + ',' + (12 + Math.sin(a) * r).toFixed(1)); }
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24"><polygon points="${pts.join(' ')}" fill="${on ? '#FFDD00' : '#DDDDDD'}"/></svg>`;
}
function openMenu() {
  const grid = document.getElementById('grid'); grid.innerHTML = '';
  LEVELS.forEach((_, i) => {
    const b = document.createElement('button');
    b.className = 'tile' + (i === level ? ' current' : '');
    const open = unlocked(i);
    b.disabled = !open;
    b.innerHTML = `<span>${i + 1}</span><span class="st">` +
      (open ? [0, 1, 2].map(k => starSVG(k < best[i])).join('') : '🔒') + '</span>';
    if (open) b.onclick = () => { closeMenu(); loadLevel(i); };
    grid.appendChild(b);
  });
  document.getElementById('menu').hidden = false;
}
function closeMenu() { document.getElementById('menu').hidden = true; }
document.getElementById('btnLevels').onclick = openMenu;
function closeIntro() { document.getElementById('intro').hidden = true; initAudio(); }
document.getElementById('btnPlay').onclick = closeIntro;
document.getElementById('intro').onclick = e => { if (e.target.id === 'intro') closeIntro(); };
document.getElementById('menuClose').onclick = closeMenu;
document.getElementById('menu').onclick = e => { if (e.target.id === 'menu') closeMenu(); };

addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') loadLevel(level);
  if ((e.key === 'Enter' || e.key === ' ') && S.phase === 'win' && level < LEVELS.length - 1) nextLevel();
  if (e.key === 'Escape') { closeMenu(); closeIntro(); }
  if (e.key === 'Enter' && !document.getElementById('intro').hidden) closeIntro();
});
document.getElementById('btnReset').onclick = () => loadLevel(level);
document.getElementById('btnColor').onclick = e => {
  rainbow = !rainbow; e.target.textContent = rainbow ? 'Plateado' : 'Arcoíris';
};

function resize() {
  const dpr = window.devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  scale = Math.min(innerWidth / VW, innerHeight / VH);
  offX = (innerWidth - VW * scale) / 2; offY = (innerHeight - VH * scale) / 2;
}
addEventListener('resize', resize); resize();

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
